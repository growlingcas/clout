<title>$CLOUT Pack Airdrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Onest:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one mobile-first column (wallet-app shape). Loud Solana-sunset top sheet with the balance, light sticker panel below. */
:root{
  --ink:#140B33; --paper:#FFFFFF; --bg:#F2EDFF; --muted:#6E6496; --line:#140B33;
  --sol:#9945FF; --mint:#14F195; --hot:#FF4D8D; --sun:#FFD23F; --sky:#1FD1FF;
  --r-common:#9AA3C7; --r-rare:#1FA2FF; --r-epic:#A445FF; --r-legendary:#FFB400;
  --display:"Rubik Mono One","Arial Black",Impact,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.col{max-width:1120px;margin:0 auto;padding-inline:16px}
.acts{max-width:520px}
/* two-column airdrop: left = pack, right = tasks + claim + live */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.split>.stack{min-width:0}
.split .left{position:sticky;top:calc(76px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.split{grid-template-columns:1fr}.split .left{position:static}}
.colhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 4px -2px}
.colhead h2{margin:0;font-family:var(--display);font-size:18px}
.colhead span{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* pack showcase */
.packhero{padding:0;overflow:hidden}
.ph-stage{position:relative;height:300px;background:radial-gradient(120% 90% at 50% 100%,#3A1D8F,var(--ink) 75%);overflow:hidden;border-bottom:2.5px solid var(--ink)}
.ph-stage::before{content:"";position:absolute;left:50%;top:55%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;opacity:.35;
  background:repeating-conic-gradient(from 0deg,#9945FF 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent);animation:rot 22s linear infinite}
.ph-stage .spark{position:absolute;width:8px;height:8px;background:var(--sun);transform:rotate(45deg);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:rotate(45deg) scale(.5)}}
.ph-card{position:absolute;top:50%;left:50%;width:128px;aspect-ratio:5/7;transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
.ph-card.c1{transform:translate(-150%,-52%) rotate(-16deg)}
.ph-card.c2{transform:translate(50%,-52%) rotate(16deg)}
.ph-card.c3{transform:translate(-50%,-78%) rotate(0deg)}
.packhero:hover .ph-card.c1{transform:translate(-165%,-56%) rotate(-22deg)}
.packhero:hover .ph-card.c2{transform:translate(65%,-56%) rotate(22deg)}
.packhero:hover .ph-card.c3{transform:translate(-50%,-92%)}
.bigpack.sp{translate:none;position:absolute;left:50%;top:50%;width:150px;transform:translate(-50%,-34%) rotate(-3deg);z-index:2;animation:hov 3.6s ease-in-out infinite}
@keyframes hov{50%{margin-top:-10px}}
.bigpack.sp .nm{font-size:24px}.bigpack.sp .sub{font-size:9.5px}
.ph-free{position:absolute;left:16px;top:16px;z-index:3;font-family:var(--display);font-size:13px;background:var(--mint);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:6px 12px;transform:rotate(-6deg);box-shadow:3px 3px 0 #000}
.ph-cap{position:absolute;right:16px;bottom:16px;z-index:3;font-family:var(--mono);font-size:12px;color:#fff;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:10px;padding:5px 10px}
.ph-cap b{color:var(--sun)}
.ph-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.ph-body h3{font-size:22px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:9px 10px}
.fact b{display:block;font-family:var(--display);font-size:18px;line-height:1.1}
.fact span{font-size:12px;color:var(--muted)}
.odds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.odd{border:2px solid var(--ink);border-radius:12px;padding:8px 9px;border-top:7px solid var(--rc);background:#fff}
.odd{min-width:0}.odd b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odd .p{font-family:var(--mono);font-weight:700;font-size:16px}
.odd .v{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.olbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 -6px}
@media (max-width:520px){.odds{grid-template-columns:repeat(3,minmax(0,1fr))}.ph-card{width:104px}.bigpack.sp{width:124px}}
.minis.wrap{flex-wrap:wrap;overflow:visible}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:#fff}
.hd .col{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 200deg,var(--sol),var(--hot),var(--sun),var(--mint),var(--sol));display:grid;place-items:center;border:2px solid #fff;flex:none}
.logo span{font-family:var(--display);font-size:15px;color:var(--ink);background:#fff;border-radius:7px;padding:2px 5px}
.bname{font-family:var(--display);font-size:13px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--ink);text-decoration:none;font-weight:800;border-radius:999px;padding:8px 15px;flex:none}
.follow:hover{background:var(--sun)}

/* top sheet */
.top{position:relative;overflow:hidden;color:#fff;background:linear-gradient(140deg,var(--sol) 0%,var(--hot) 55%,var(--sun) 110%);border-bottom:3px solid var(--ink)}
.top::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.22) 1.3px,transparent 1.7px) 0 0/16px 16px;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.7;animation:drift 12s ease-in-out infinite}
.blob.a{width:260px;height:260px;background:var(--mint);left:-80px;bottom:-120px}
.blob.b{width:200px;height:200px;background:var(--sky);right:-60px;top:-80px;animation-delay:-5s}
@keyframes drift{50%{transform:translate(30px,-20px) scale(1.15)}}
.top .col{position:relative;padding-block:26px 0}
.fanmini{position:absolute;right:6px;top:18px;width:132px;height:120px;pointer-events:none}
.fanmini i{position:absolute;width:62px;height:86px;border-radius:10px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);top:14px;left:34px;animation:bob 4s ease-in-out infinite}
.fanmini i:nth-child(1){background:var(--mint);transform:rotate(-18deg) translateX(-30px)}
.fanmini i:nth-child(2){background:var(--sky);transform:rotate(16deg) translateX(30px);animation-delay:-1.3s}
.fanmini i:nth-child(3){background:#fff;transform:rotate(-2deg) translateY(-8px);animation-delay:-2.6s;display:grid;place-items:center}
.fanmini i:nth-child(3)::after{content:"$";font-family:var(--display);font-size:30px;color:var(--hot)}
@keyframes bob{50%{margin-top:-8px}}
.bal-l{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.bal-n{font-family:var(--display);font-size:clamp(46px,14vw,72px);line-height:1;margin:6px 0 22px;text-shadow:4px 4px 0 var(--ink);font-variant-numeric:tabular-nums}
.bal-n .c{opacity:.6}
.bal-n.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.08)}}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:18px;padding:13px 4px 10px;font-weight:800;font-size:13px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.act:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.act:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.act .ic{width:24px;height:24px}
.tabs{display:flex;gap:6px;margin-top:22px}
.tab{background:none;border:0;border-radius:14px 14px 0 0;padding:12px 18px;font-family:var(--display);font-size:15px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);border:3px solid var(--ink);border-bottom:0;margin-bottom:-3px}
.tag{font-family:var(--mono);font-size:11px;background:var(--mint);color:var(--ink);border-radius:999px;padding:2px 8px;border:2px solid var(--ink)}

/* panel */
.panel{padding-block:20px 60px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:16px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.card h3{margin:0;font-size:17px;font-weight:800;line-height:1.2}
.card p{margin:3px 0 0;color:var(--muted)}
.t-ic{width:44px;height:44px;flex:none;border-radius:14px;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center}
.row{display:flex;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2.5px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);font-weight:800;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;text-decoration:none;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.btn[disabled]{background:#E4DEF5;color:#8F86B3;border-color:#B9B0D8;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ink{background:var(--ink);color:#fff}
.btn.mint{background:var(--mint)} .btn.hot{background:var(--hot);color:#fff} .btn.sky{background:var(--sky)}
.btn.wide{width:100%;padding:14px;font-size:16px}

/* pack card */
.packcard{position:relative;overflow:hidden;background:linear-gradient(120deg,#fff 55%,#FFF2B8)}
.packcard .row{position:relative;z-index:1}
.packcard .tx{flex:1;min-width:0;padding-right:70px}
.peek{position:absolute;right:-14px;top:-10px;width:96px;height:130px;transform:rotate(14deg);border-radius:12px;border:2.5px solid var(--ink);background:linear-gradient(160deg,var(--sol),var(--hot) 60%,var(--sun));box-shadow:3px 3px 0 var(--ink)}
.peek::after{content:"CLOUT";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font-family:var(--display);font-size:14px;color:#fff;letter-spacing:.1em}
.packcard .acts2{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
.minis{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;position:relative;z-index:1}

/* username */
.lbl{font-weight:800;font-size:14px;margin:0 0 8px;display:block}
.fld{flex:1;min-width:0;display:flex;align-items:center;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);padding-left:12px}
.fld span{font-weight:800;color:var(--muted)}
.fld input{flex:1;min-width:0;border:0;background:none;padding:11px 10px 11px 4px;outline:none}
.fld:focus-within{border-color:var(--sol);box-shadow:0 0 0 3px color-mix(in srgb,var(--sol) 25%,transparent)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.me .ava{width:46px;height:46px;border-radius:50%;background:var(--mint);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.me .s{font-size:12px;margin:0;color:var(--muted)}
.me .h{font-weight:800;font-size:18px;margin:0;color:var(--ink)}
.chg{margin-left:auto;background:none;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:700}

/* progress + tasks */
.prog{display:flex;align-items:center;gap:12px;margin:6px 4px 0}
.bar{flex:1;height:12px;border-radius:99px;background:#fff;border:2.5px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky),var(--sol));transform-origin:left;transform:scaleX(0);transition:transform .6s cubic-bezier(.2,.9,.3,1.2)}
.prog b{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.task{display:flex;gap:12px;align-items:center}
.task .tx{flex:1;min-width:0}
.task .tx h3{font-size:15.5px}
.task .tx p{font-size:13.5px}
.task.done{background:#E9FFF5}
.task.done .t-ic{background:var(--mint)}
.task.flash{animation:flash .7s}
@keyframes flash{30%{transform:scale(1.03)}}
.again{background:none;border:0;padding:0;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--sol);text-decoration:underline}
.ok{display:inline-flex;gap:5px;align-items:center;font-weight:800;color:#0E9F63}
.task .btn{padding:8px 13px;font-size:14px}
.task[aria-disabled="true"]{opacity:.55}

/* claim */
.inp{width:100%;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);padding:12px;margin:14px 0 10px;font-family:var(--mono);font-size:13px;outline:none}
.inp:focus{border-color:var(--sol)}
.inp:disabled{border-color:#C9C1E3;color:#9A91BE}
.err{color:#D6264F;font-weight:700;font-size:13px;margin:-4px 0 10px}
.claimed{background:linear-gradient(120deg,#E9FFF5,#fff)}
.tick{width:46px;height:46px;border-radius:50%;background:var(--mint);border:2.5px solid var(--ink);display:grid;place-items:center;flex:none}
.st{margin-top:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st .pill{background:var(--sun);border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-weight:800}
.mono{font-family:var(--mono)}

/* live */
.live h3{display:flex;align-items:center;gap:8px}
.live h3 i{width:10px;height:10px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.4)}}
.live ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.live li{display:flex;gap:10px;align-items:center;font-size:14px}
.live li .av{width:34px;height:34px;border-radius:50%;background:var(--sky);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.live li .w{flex:1;min-width:0}
.live li .w p{margin:0;color:var(--ink)}
.live li .w span{font-size:12px;color:var(--muted)}
.live .empty{color:var(--muted);text-align:center;padding:14px 0 4px;margin:0}
.amt{color:#0E9F63}

/* referral */
.link-row{display:flex;gap:8px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;padding:6px 6px 6px 12px;background:var(--bg);margin:8px 0 12px}
.link-row span{flex:1;min-width:0;font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats .card p{margin:0;font-size:13px}
.stats .card b{font-family:var(--display);font-size:26px;display:block;margin-top:4px}
.how ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.how li{display:flex;gap:12px;align-items:center}
.how li b{display:block}
.how li span.d{font-size:13.5px;color:var(--muted)}
.ref-empty{text-align:center;padding:28px 18px}
.ref-empty .t-ic{margin:0 auto 12px;width:56px;height:56px;background:var(--sun)}
.ref-empty .btn{margin-top:14px}
.refhead{display:flex;gap:12px;align-items:center}
.refhead .av{width:42px;height:42px;border-radius:50%;background:var(--sky);border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.refhead b{display:block}.refhead span{font-size:13px;color:#0E9F63;font-weight:700}
.link-row .pre{flex:none!important;color:var(--muted)}
.link-row input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);outline:none;padding:6px 0}
.link-row:focus-within{box-shadow:0 0 0 3px var(--sky)}
.hint{margin:-4px 0 12px;font-size:12.5px;color:var(--muted)}.hint.bad{color:#E5484D}

/* real cards: the 630x882 card design, scaled */
.cbox{position:relative;flex:none}
.cbox>.cin{position:absolute;left:0;top:0;width:630px;height:882px;transform-origin:0 0}
@property --fa{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes cspin{to{--fa:360deg}}
@keyframes cholo{to{background-position:300% 0}}
.frame-legendary{animation:cspin 4s linear infinite}
.holo{animation:cholo 5s linear infinite}
.ph-card{filter:drop-shadow(4px 5px 0 #000)}
.mini{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono);font-weight:700;font-size:12px;color:#0E9F63}
.mini .cbox{filter:drop-shadow(2px 3px 0 var(--ink))}
.gallery{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.gallery .mini{scroll-snap-align:start;color:var(--muted);font-weight:500;font-size:11px}
.packcard .acts3{display:flex;gap:10px;margin-top:12px}

/* pack opening overlay */
.fx{position:fixed;inset:0;z-index:100;background:radial-gradient(70vmax 70vmax at 50% 45%,#3A1D8F,var(--ink) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:hidden;--glow:#9945FF}
.fx[hidden]{display:none!important}
.fx.shake{animation:scr .55s}
@keyframes scr{10%,50%,90%{transform:translate(-9px,5px)}30%,70%{transform:translate(9px,-5px)}}
.fx .rays{position:absolute;left:50%;top:48%;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;pointer-events:none;opacity:.22;
  background:repeating-conic-gradient(from 0deg,var(--glow) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent);animation:rot 18s linear infinite;transition:opacity .5s}
.fx.g-rare{--glow:#1FA2FF}.fx.g-epic{--glow:#A445FF}.fx.g-legendary{--glow:#FFB400}
.fx.g-rare .rays{opacity:.45}.fx.g-epic .rays{opacity:.7}.fx.g-legendary .rays{opacity:.95;animation-duration:6s}
@keyframes rot{to{transform:rotate(360deg)}}
.fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.fx-top{position:relative;text-align:center;z-index:6}
.fx-top .l{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.fx-top .tot{font-family:var(--display);font-size:44px;line-height:1.1;color:var(--mint);font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 #000;display:inline-block}
.fx-top .tot.bump{animation:bump .5s}
.fx-close{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:7;width:40px;height:40px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.stage{position:relative;flex:1;width:100%;z-index:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.fx.burst .flash{animation:fl .7s}
@keyframes fl{15%{opacity:.9}}

.bigpack{position:absolute;left:50%;top:50%;width:min(230px,58vw);aspect-ratio:3/4.3;margin:0;translate:-50% -50%;cursor:pointer;filter:drop-shadow(6px 8px 0 #000);background:none;border:0;padding:0;--glow:#FFD23F}
.bigpack .body,.bigpack .lid{position:absolute;left:0;right:0;background:linear-gradient(160deg,var(--sol),var(--hot) 55%,var(--sun));overflow:hidden}

.bigpack.enter{animation:packin .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes packin{from{transform:translateY(-80vh) rotate(-28deg) scale(.5)}}

@keyframes charge{0%{transform:none}10%{transform:rotate(-2deg) translateX(-3px)}20%{transform:rotate(2deg) translateX(3px)}30%{transform:rotate(-3deg) translateX(-5px) scale(1.02)}40%{transform:rotate(3deg) translateX(6px) scale(1.04)}50%{transform:rotate(-5deg) translateX(-8px) scale(1.06)}60%{transform:rotate(5deg) translateX(9px) scale(1.08)}70%{transform:rotate(-7deg) translateX(-11px) scale(1.1)}80%{transform:rotate(7deg) translateX(12px) scale(1.12)}90%{transform:rotate(-3deg) scale(1.15)}100%{transform:scale(1.16)}}
.bigpack.charge .seam{animation:seam 1.2s ease-in both}
@keyframes seam{from{opacity:0}to{opacity:1}}
.bigpack.charge .body{filter:brightness(1.25) saturate(1.2)}
.bigpack.tear{transform:scale(1.16)}
.bigpack.tear .lid{transform:translate(110px,-260px) rotate(42deg);opacity:0}

.deck{position:absolute;left:50%;top:50%;width:calc(630px * var(--s,.4));height:calc(882px * var(--s,.4));translate:-50% -50%;cursor:pointer;perspective:1400px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}

  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.25) 1.5px,transparent 2px) 0 0/14px 14px,linear-gradient(160deg,var(--sol),var(--hot) 55%,var(--sun))}

<script>
(()=>{
/* ---------------- config: edit for launch ---------------- */
const cfg={
  name:'$CLOUT PACK AIRDROP', ticker:'CLOUT', xHandle:'CloutPacks', postUrl:'',

  rare:     {w:21.5,v:4,   frame:'#1FA2FF', pill:'#8FD3FF', inner:'#164D8C', holo:false, cls:''},
  epic:     {w:3,   v:15,  frame:'#A445FF', pill:'#D8B0FF', inner:'#5A1F9E', holo:true,  cls:''},
  legendary:{w:0.5, v:100, frame:'conic-gradient(from var(--fa, 0deg), #FFB400, #FF4D8D, #9945FF, #1FD1FF, #14F195, #FFD23F, #FFB400)', pill:'#FFD23F', inner:'#6A3A10', holo:true, cls:'frame-legendary'}
};
const RAR={common:'Common',uncommon:'Uncommon',rare:'Rare',epic:'Epic',legendary:'Legendary'};

const TIER={common:0,uncommon:0,rare:1,epic:2,legendary:3}; // effect strength

/* background + pill icons, all on a 40x40 grid */
const SYM={
  sol:'<path d="M8 4 H40 L32 12 H0 Z M0 16 H32 L40 24 H8 Z M8 28 H40 L32 36 H0 Z"/>',

/* ---------------- roulette fx ---------------- */
const fx=q('[data-fx]'),reel=q('[data-reel]'),strip=q('[data-strip]'),winbig=q('[data-winbig]'),pRow=q('[data-prow]'),pTotal=q('[data-ptotal]'),pHint=q('[data-phint]'),pDone=q('[data-pdone]'),banner=q('[data-banner]'),stageEl=q('[data-stage]'),spinBtn=q('[data-spin]'),leftEl=q('[data-left]'),choiceEl=q('[data-choice]'),heldEl=q('[data-held]');
const cvs=q('[data-fxc]'),cx=cvs.getContext('2d');
let opening=false,busy=false,shown=0,RS=.24,awaiting=false;

/* sound: tiny synth, starts on the first tap */
let ac=null;
function tone(f,d=.12,g=.05,type='triangle',when=0,slide=0){if(calm)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime+when,o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={
  tick:()=>tone(1300+Math.random()*250,.03,.03,'square'),
  tease:()=>tone(80,.8,.05,'sawtooth',0,320),
  reveal:t=>{const n=[523,659,784,1047,1319,1568,2093];for(let i=0;i<=t*2+1;i++)tone(n[i],.3,.05,'triangle',i*.07)},
  coin:()=>tone(1568,.12,.03,'square')
};

/* particles */
let P=[],raf=0,dpr=1;
function sizeCvs(){dpr=Math.min(2,devicePixelRatio||1);cvs.width=innerWidth*dpr;cvs.height=innerHeight*dpr}
function spawn(x,y,n,cols,o={}){if(calm)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.sp||8)*(.35+Math.random());
  P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||2),g:o.g??.28,l:0,max:60+Math.random()*50,s:(o.size||8)*(.5+Math.random()),c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,k:o.kind||(Math.random()<.5?'rect':'dot')})}loop()}
function coinRain(n){if(calm)return;for(let i=0;i<n;i++)P.push({x:Math.random()*innerWidth,y:-30-Math.random()*innerHeight*.6,vx:(Math.random()-.5),vy:2+Math.random()*3,g:.1,l:0,max:220,s:9+Math.random()*7,c:'#FFD23F',r:Math.random()*6,vr:.15+Math.random()*.2,k:'coin'});loop()}
function loop(){if(raf)return;const f=()=>{cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.l++<p.max&&p.y<innerHeight+40);
  for(const p of P){p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;const a=Math.min(1,(p.max-p.l)/25);cx.globalAlpha=a;cx.save();cx.translate(p.x,p.y);
    if(p.k==='coin'){const w=Math.abs(Math.cos(p.r))*p.s+1;cx.fillStyle='#FFB400';cx.beginPath();cx.ellipse(0,0,w,p.s,0,0,Math.PI*2);cx.fill();cx.fillStyle='#FFE89A';cx.beginPath();cx.ellipse(0,0,w*.6,p.s*.6,0,0,Math.PI*2);cx.fill()}
    else if(p.k==='star'){cx.rotate(p.r);cx.fillStyle=p.c;cx.beginPath();for(let j=0;j<8;j++){const rr=j%2?p.s*.4:p.s;cx.lineTo(Math.cos(j*Math.PI/4)*rr,Math.sin(j*Math.PI/4)*rr)}cx.fill()}
    else{cx.rotate(p.r);cx.fillStyle=p.c;if(p.k==='dot'){cx.beginPath();cx.arc(0,0,p.s/2,0,Math.PI*2);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
    cx.restore()}cx.globalAlpha=1;
  if(P.length)raf=requestAnimationFrame(f);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight)}};raf=requestAnimationFrame(f)}
const center=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};

function setGlow(r){fx.classList.remove('g-rare','g-epic','g-legendary');if(r&&r!=='common'){void fx.offsetWidth;fx.classList.add('g-'+r)}}
function flash(){fx.classList.remove('burst');void fx.offsetWidth;fx.classList.add('burst')}
function shakeScreen(){fx.classList.remove('shake');void fx.offsetWidth;fx.classList.add('shake')}
function slam(text,color){banner.textContent=text;banner.style.color=color;banner.classList.remove('go');void banner.offsetWidth;banner.classList.add('go')}
function floatPlus(v){const el=document.createElement('div');el.className='plus';el.textContent='+'+usd(v);stageEl.append(el);setTimeout(()=>el.remove(),1400)}
function ring(color){const el=document.createElement('div');el.className='ring';el.style.setProperty('--tc',color);stageEl.append(el);setTimeout(()=>el.remove(),950)}
function countTo(to){const from=shown,t0=performance.now();shown=to;pTotal.classList.remove('bump');void pTotal.offsetWidth;pTotal.classList.add('bump');
  const step=t=>{const k=Math.min(1,(t-t0)/700);pTotal.textContent=usd(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function fitScale(){RS=Math.max(.17,Math.min(.27,innerWidth/2600+.06,(innerHeight-330)/882*.62));stageEl.style.setProperty('--rs',RS)}

/* reel filler: rare cards shown more often than they drop, like a case reel */
const SHOW={common:24,uncommon:24,rare:24,epic:16,legendary:12};
function filler(){let u=Math.random()*100,r='common';for(const k of Object.keys(SHOW)){u-=SHOW[k];if(u<=0){r=k;break}}const pool=CARDS.filter(c=>c.rarity===r);return pool[Math.floor(Math.random()*pool.length)]}
const slot=(c,win)=>`<div class="slot${win?' win':''}" style="--tc:${RCOL[c.rarity]}">${cbox(c,RS)}</div>`;
function stepPx(){return 630*RS+14}
function setX(x){strip.style.transform=`translate3d(${x}px,0,0)`}
function idleReel(){strip.innerHTML=Array.from({length:14},filler).map(c=>slot(c)).join('');reel.classList.remove('done');setX(reel.clientWidth/2-(3*stepPx()+630*RS/2))}

function updateSpinUI(){const ok=canSpin();
  leftEl.textContent=`Balance ${usd(W.bal)}`+(W.free?` · ${W.free} free spin${W.free===1?'':'s'}`:'')+` · ${usd(cfg.spinPrice)} per spin`;
  spinBtn.hidden=awaiting;spinBtn.disabled=busy||!ok;spinBtn.textContent=spinLabel();choiceEl.hidden=!awaiting;
  if(!busy&&!awaiting&&!ok)pHint.textContent=W.reward?'Out of balance. Sell cards from your collection to spin more.':`Out of balance. Finish the tasks to get ${usd(cfg.taskReward)}.`}
function heldText(){const n=W.cards.length;heldEl.textContent=n?`Collection: ${n} card${n===1?'':'s'} · worth ${usd(W.cards.reduce((a,id)=>a+cardVal(byId(id)),0))}`:''}
const tagMini=(c,k)=>`<div class="mini" title="${esc(c.name)}">${cbox(c,.1)}<span style="color:${k==='sell'?'#FF8BC4':'#14F195'}">${k==='sell'?'SOLD '+usd(sellAmt(c)):'HELD '+usd(cardVal(c))}</span></div>`;
let curCard=null;

function openPackFx(){if(opening)return;opening=true;busy=false;awaiting=false;curCard=null;shown=W.bal;
  fx.hidden=false;fx.className='fx';document.body.style.overflow='hidden';sizeCvs();fitScale();
  pRow.innerHTML='';pDone.hidden=true;winbig.innerHTML='';winbig.className='winbig';
  pTotal.textContent=usd(W.bal);q('[data-plabel]').textContent='Balance';heldText();
  pHint.textContent=W.free?'Your first spin is free':`Each spin costs ${usd(cfg.spinPrice)}`;idleReel();updateSpinUI();spinBtn.focus()}

async function spin(){if(busy||awaiting||!canSpin())return;busy=true;
  if(W.free>0)W.free--;else{W.bal=Math.round((W.bal-cfg.spinPrice)*100)/100;countTo(W.bal);tone(220,.15,.04,'triangle',0,120)}
  W.spins++;saveW();balance();updateSpinUI();
  const c=rollCard(),t=TIER[c.rarity],col=RCOL[c.rarity];curCard=c;
  setGlow(null);reel.classList.remove('done');winbig.className='winbig';winbig.innerHTML='';pHint.textContent='Rolling…';
  const N=58,WIN=50,items=Array.from({length:N},filler);items[WIN]=c;
  if(t<3&&Math.random()<.45){const leg=CARDS.filter(x=>x.rarity==='legendary');items[WIN+(Math.random()<.5?1:-1)]=leg[Math.floor(Math.random()*leg.length)]}
  strip.innerHTML=items.map((x,i)=>slot(x,i===WIN)).join('');
  const st=stepPx(),w=630*RS,mid=reel.clientWidth/2;
  const start=mid-(2*st+w/2),target=mid-(WIN*st+w*(.12+Math.random()*.76));
  setX(start);
  const dur=calm?400:6200,t0=performance.now();let last=Math.floor((mid-start)/st);
  const ease=k=>1-Math.pow(1-k,4.4);
  await new Promise(res=>{const f=now=>{const k=Math.min(1,(now-t0)/dur),x=start+(target-start)*ease(k);setX(x);
    const i=Math.floor((mid-x)/st);if(i!==last){last=i;SFX.tick()}
    if(k<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
  reel.classList.add('done');
  const winEl=q('.slot.win',strip);
  if(t>=2){winEl.classList.add('tease');pHint.textContent=t===3?'No way…':'Ooh…';SFX.tease();
    const [ex,ey]=center(winEl);const iv=setInterval(()=>spawn(ex,ey,5,[col,'#FFFFFF'],{sp:4,g:0,up:0,size:5,kind:'dot'}),110);
    await wait(calm?0:t===3?1100:700);clearInterval(iv);winEl.classList.remove('tease')}
  const [ex,ey]=center(winEl);setGlow(c.rarity);SFX.reveal(Math.min(t,3));
  if(c.rarity==='common')spawn(ex,ey,18,['#FFFFFF','#CFC6F5'],{sp:6,size:6,kind:'star'});
  if(c.rarity==='uncommon'){ring(col);spawn(ex,ey,26,[col,'#FFFFFF','#B5F5D0'],{sp:7,size:7,kind:'star'})}
  if(t===1){ring(col);spawn(ex,ey,40,[col,'#FFFFFF','#8FD3FF'],{sp:9,size:8})}
  if(t===2){ring(col);setTimeout(()=>ring('#FFFFFF'),160);spawn(ex,ey,80,[col,'#FF8BD0','#FFFFFF','#D8B0FF'],{sp:12,size:9});slam('EPIC!','#D8B0FF')}
  if(t===3){flash();shakeScreen();ring(col);setTimeout(()=>ring('#FF4D8D'),150);setTimeout(()=>ring('#14F195'),300);
    spawn(ex,ey,140,['#FFD23F','#FFB400','#FF4D8D','#14F195','#1FD1FF','#FFFFFF'],{sp:16,size:11});coinRain(70);slam('LEGENDARY!','#FFD23F');
    for(let i=0;i<6;i++)setTimeout(SFX.coin,400+i*120)}
  if(t>=2)liveAdd({handle:'you',usd:cardVal(c),kind:'pull',card:c.name,at:Date.now()});
  const bigS=Math.min(.46,(innerHeight-330)/882,innerWidth*.62/630);
  winbig.style.setProperty('--tc',col);winbig.innerHTML=cbox(c,bigS);void winbig.offsetWidth;winbig.classList.add('in');
  pHint.textContent=`${RAR[c.rarity]} · ${c.name} · worth ${usd(cardVal(c))}`;
  q('[data-sellamt]').textContent=usd(sellAmt(c))+' now';q('[data-holdamt]').textContent=`keep the card · ${usd(cardVal(c))}`;
  awaiting=true;busy=false;updateSpinUI();q('[data-hold]').focus()}
spinBtn.addEventListener('click',spin);

async function choose(kind){if(!awaiting||!curCard)return;awaiting=false;busy=true;choiceEl.hidden=true;
  const c=curCard,[wx,wy]=center(winbig);curCard=null;
  if(kind==='sell'){const amt=sellAmt(c);W.bal=Math.round((W.bal+amt)*100)/100;winbig.classList.add('sold');countTo(W.bal);floatPlus(amt);
    spawn(wx,wy,40,['#FFD23F','#FFB400','#FFFFFF'],{sp:10,size:9,kind:'dot'});tone(1046,.1,.05,'square');tone(1568,.18,.05,'square',.08)}
  else{W.cards.push(c.id);winbig.classList.add('held');spawn(wx,wy,24,[RCOL[c.rarity],'#14F195','#FFFFFF'],{sp:7,size:7,kind:'star'});tone(659,.15,.05,'triangle');tone(988,.2,.05,'triangle',.1)}
  saveW();balance();heldText();await wait(calm?0:560);
  pRow.insertAdjacentHTML('beforeend',tagMini(c,kind));while(pRow.children.length>8)pRow.firstElementChild.remove();
  winbig.innerHTML='';winbig.className='winbig';setGlow(null);reel.classList.remove('done');busy=false;
  pHint.textContent=kind==='sell'?`Sold for ${usd(sellAmt(c))}. Spin again?`:`${c.name} is in your collection. Spin again?`;updateSpinUI();if(!spinBtn.disabled)spinBtn.focus()}
q('[data-sell]').addEventListener('click',()=>choose('sell'));
q('[data-hold]').addEventListener('click',()=>choose('hold'));

/* leaving mid-choice keeps the card */
function closeFx(){if(busy)return;if(awaiting&&curCard){W.cards.push(curCard.id);saveW();toast(`${curCard.name} kept in your collection`);curCard=null;awaiting=false}
  fx.hidden=true;opening=false;document.body.style.overflow='';P=[];renderAll()}
q('[data-fx-close]').addEventListener('click',closeFx);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!fx.hidden)closeFx()});
addEventListener('resize',()=>{if(!fx.hidden){sizeCvs();if(!busy){fitScale();if(!reel.classList.contains('done'))idleReel()}}});

/* ---------------- boot ---------------- */
const ref=((location.pathname.match(/\/@([A-Za-z0-9_]{3,15})\/?$/)||[])[1])||new URLSearchParams(location.search).get('ref')||((location.hash.match(/^#@?([A-Za-z0-9_]{3,15})$/)||[])[1]);
if(ref&&SLUG.test(ref)&&!invite&&ref.toLowerCase()!==String(user()).toLowerCase()){invite=ref;store.set(K+'invite',invite)}
function renderAll(){renderCollTag();if(!q('[data-panel="collection"]').hidden)renderCollection();renderPack();renderTasks();renderClaim();renderLive();balance();if(!q('[data-panel="referral"]').hidden)renderRef()}
renderAll();
})();
</script>
